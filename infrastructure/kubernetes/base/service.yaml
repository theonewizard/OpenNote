apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: opennote
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: opennote
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: opennote
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: opennote
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
