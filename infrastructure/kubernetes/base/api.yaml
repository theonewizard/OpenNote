# The API server: uvicorn on port 8000, the image's default command. Probes: /healthz
# (cheap, no dependencies) for startup and liveness, /readyz (database, Valkey and both
# directories; 503 while one is down) for readiness, every 10 s because each call opens
# connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: opennote
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opennote
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opennote
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image runs as UID 1001, group 0. fsGroup makes the volumes writable on
        # Kubernetes; the OpenShift overlay removes it (the restricted SCC assigns one).
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/theonewizard/opennote-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: opennote
          env:
            - name: OPENNOTE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opennote
                  key: OPENNOTE_DATABASE_URL
            - name: OPENNOTE_VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: opennote
                  key: OPENNOTE_VALKEY_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vaults
              mountPath: /var/lib/opennote/vaults
            - name: history
              mountPath: /var/lib/opennote/history
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vaults
          persistentVolumeClaim:
            claimName: vaults
        - name: history
          persistentVolumeClaim:
            claimName: history
        - name: tmp
          emptyDir: {}
