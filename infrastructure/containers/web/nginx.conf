# nginx for opennote-web: serves the built web app and forwards /api/, /healthz and /readyz
# unchanged to the API service. Runs as any non-root UID on a read-only root filesystem:
# the pid file and all temporary files live in /tmp.

# Not auto: each worker takes memory, and the pod is limited to 128Mi on any node size.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Without the query string ($uri, not $request) and without the Referer, either of which
    # can carry a token. $uri is the URI after internal redirects, so app routes served the
    # app shell are logged as /index.html, and nginx's own request errors as /_errors/<status>.
    log_format opennote '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout opennote;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # The probes need no credentials, and each /readyz opens database and Valkey
    # connections, so one client gets 5 probes per second (burst 10); the rest get 429.
    limit_req_zone $binary_remote_addr zone=probes:1m rate=5r/s;
    limit_req_status 429;

    # Vite's hashed build output never changes under the same name; the app shell must be
    # revalidated so a new release is picked up. Other responses get no Cache-Control from
    # here (add_header skips an empty value).
    map $uri $cache_control {
        default "";
        /index.html "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/opennote/web;

        # Every response, proxied ones included. No location below sets add_header, so
        # none of them drops these. Cache-Control only on 2xx and 3xx responses (no always).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $cache_control;

        # Written at start by entrypoint.sh: `resolver` with the container's nameservers
        # and `set $api http://<OPENNOTE_API_UPSTREAM, default api:8000>`. A variable
        # upstream is looked up when a request needs it (cached for 30 s), so a restarted
        # api container with a new address is found again.
        include /tmp/nginx-runtime.conf;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx's own errors only: the API's responses, its problem details included, pass
        # through unchanged. Each is a problem (RFC 9457) instead of nginx's HTML page.
        proxy_intercept_errors off;
        error_page 502 503 504 = @upstream_unavailable;
        error_page 429 = @rate_limited;
        # Errors in reading the request go to internal URIs, not named locations: a request
        # line that does not parse leaves no URI, and nginx answers 500 to a redirect of such
        # a request to a named location. 494 is nginx's own code for request headers that
        # are too large, which it would otherwise send as a 400.
        error_page 400 = /_errors/400;
        error_page 408 = /_errors/408;
        error_page 413 = /_errors/413;
        error_page 414 = /_errors/414;
        error_page 431 494 = /_errors/431;

        location /api/ {
            proxy_pass $api;
        }

        location = /healthz {
            limit_req zone=probes burst=10 nodelay;
            proxy_pass $api;
        }

        location = /readyz {
            limit_req zone=probes burst=10 nodelay;
            proxy_pass $api;
        }

        location @upstream_unavailable {
            default_type application/problem+json;
            return 503 '{"type":"https://opennote.dev/problems/upstream-unavailable","title":"Service Unavailable","status":503}';
        }

        location @rate_limited {
            default_type application/problem+json;
            return 429 '{"type":"https://opennote.dev/problems/rate-limited","title":"Too Many Requests","status":429}';
        }

        location = /_errors/400 {
            internal;
            default_type application/problem+json;
            return 400 '{"type":"https://opennote.dev/problems/http-error","title":"Bad Request","status":400}';
        }

        location = /_errors/408 {
            internal;
            default_type application/problem+json;
            return 408 '{"type":"https://opennote.dev/problems/http-error","title":"Request Timeout","status":408}';
        }

        location = /_errors/413 {
            internal;
            default_type application/problem+json;
            return 413 '{"type":"https://opennote.dev/problems/http-error","title":"Content Too Large","status":413}';
        }

        location = /_errors/414 {
            internal;
            default_type application/problem+json;
            return 414 '{"type":"https://opennote.dev/problems/http-error","title":"URI Too Long","status":414}';
        }

        location = /_errors/431 {
            internal;
            default_type application/problem+json;
            return 431 '{"type":"https://opennote.dev/problems/http-error","title":"Request Header Fields Too Large","status":431}';
        }

        # A missing asset is a 404, not the app shell.
        location /assets/ {
            try_files $uri =404;
        }

        # Client-side routes: anything that is not a file gets the app shell.
        location / {
            try_files $uri /index.html;
        }
    }
}
