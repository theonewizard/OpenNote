apiVersion: v1
kind: Service
metadata:
  name: {{ include "opennote.fullname" . }}-api
  labels:
    {{- include "opennote.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "opennote.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
