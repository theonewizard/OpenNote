{{- /* The vaults and the note history. Kept on `helm uninstall`: delete them by hand to
remove the data. */ -}}
{{- range $volume := list "vaults" "history" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opennote.fullname" $ }}-{{ $volume }}
  labels:
    {{- include "opennote.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ $.Values.persistence.accessMode }}]
  {{- with $.Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ index $.Values.persistence $volume "size" }}
{{- end }}
