# Alembic configuration. The database URL is deliberately not kept here: migrations/env.py
# takes it from `alembic -x url=...` or else from OPENNOTE_DATABASE_URL (or
# OPENNOTE_DATABASE_URL_FILE) through the app's settings.

[alembic]
script_location = %(here)s/migrations
# Makes `app` importable from env.py whatever the working directory.
prepend_sys_path = %(here)s
path_separator = os
