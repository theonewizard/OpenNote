# Project metadata and tool configuration (ADR-0014). Dependencies are pinned in
# requirements.txt and requirements-dev.txt, not here.

[project]
name = "opennote-backend"
description = "OpenNote API server and background worker"
requires-python = ">=3.14"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # bugbear
    "UP",    # pyupgrade
    "S",     # bandit security rules
    "SIM",   # simplifications
    "ASYNC", # blocking calls in async code
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"] # pytest checks with assert; seeded test RNGs are not crypto
"tests/conftest.py" = ["E402"] # settings placeholders are set before the app is imported

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "compatibility: the shared Markdown compatibility corpus (testing strategy §3)",
    "sync_sim: the seeded multi-client sync simulation (testing strategy §4)",
]
filterwarnings = ["error"]
