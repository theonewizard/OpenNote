# Project metadata and tool configuration (ADR-0014). Dependencies are pinned in
# requirements.txt and requirements-dev.txt, not here.

[project]
name = "opennote-backend"
description = "OpenNote API server and background worker"
requires-python = ">=3.13"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # bugbear
    "UP",    # pyupgrade
    "S",     # bandit security rules
    "SIM",   # simplifications
    "ASYNC", # blocking calls in async code
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest checks with assert
"tests/conftest.py" = ["E402"] # settings placeholders are set before the app is imported

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette 1.8 prefers httpx2 for its TestClient; httpx stays until that switch is decided.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
