# Trivy secret-scanner settings. Trivy reads this file by default from the directory it runs
# in, so every `trivy image` and `trivy fs` step in CI (run from the repository root) uses it.
#
# The Anthropic SDK (backend/requirements.txt, version-pinned in backend/constraints.txt) has
# docstrings with an example JSON object whose type is service_account. Trivy's
# gcp-service-account rule reports that text as a CRITICAL secret in the api image. It is
# documentation, not a credential, so the SDK's installed package directory is skipped by
# the secret scanner; every other path is still scanned, and vulnerability scanning of the
# package is unchanged. Decided by the project owner on 2026-11-19 (R-P7-017).
allow-rules:
  - id: anthropic-sdk-docstrings
    description: Example JSON in the Anthropic SDK's docstrings, not a credential
    path: site-packages/anthropic/
