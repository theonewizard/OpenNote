# Dependabot version updates: docs/development/setup.md, "Continuous integration".
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /infrastructure/containers/api
      - /infrastructure/containers/postgres
      - /infrastructure/containers/valkey
      - /infrastructure/containers/web
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: swift
    directories:
      - /apple/Packages/OpenNoteAPI
      - /apple/Packages/OpenNoteCore
      - /apple/Packages/OpenNoteEditor
      - /apple/Packages/OpenNoteStorage
      - /apple/Packages/OpenNoteSync
    schedule:
      interval: weekly
      day: monday
    groups:
      swift-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
