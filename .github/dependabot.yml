# Dependabot version updates: docs/development/setup.md, "Continuous integration".
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /infrastructure/containers/api
      - /infrastructure/containers/postgres
      - /infrastructure/containers/valkey
      - /infrastructure/containers/web
    schedule:
      interval: weekly
      day: monday
    # One pull request per base image across the four directories (group-by), whatever the
    # bump: on 2026-10-26 a digest-only bump of ubi-minimal arrived as four pull requests, one
    # per directory, because it fell outside the minor-and-patch filter the group had then.
    groups:
      docker-base-images:
        patterns: ["*"]
        group-by: dependency-name

# The five Swift packages (apple/Packages/*) are not listed: Dependabot's Swift updater runs Swift 6.3.1
# and cannot read their `swift-tools-version: 6.4` manifests (first run on 2026-10-18 failed with
# "package 'opennoteapi' is using Swift tools version 6.4.0 but the installed version is 6.3.1").
# Their pins are updated by hand with their versions.md rows; add the `swift` ecosystem back once
# Dependabot's updater ships Swift 6.4 or newer.
