# Containers: build the images, run the full stack and the dev stack with smoke tests,
# run them as an arbitrary UID, and scan the images with Trivy; weekly as well as on every
# push and pull request, so new fixes in the base images and packages are picked up
# (docs/development/setup.md, "Continuous integration").
name: containers

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**", "security/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels a branch's running run; runs on main and scheduled runs finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

defaults:
  run:
    shell: bash

env:
  FULL: infrastructure/compose/compose.yaml
  DEV: infrastructure/compose/compose.dev.yaml

jobs:
  images:
    name: build, run, scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images with the tags compose.yaml expects
        id: build
        run: docker compose -f "$FULL" build

      - name: Versions installed in the images
        run: |
          docker run --rm --entrypoint rpm opennote-api:dev -q python3.14
          docker run --rm --entrypoint rpm opennote-web:dev -q nginx-core
          docker run --rm --entrypoint rpm opennote-postgres:dev -q \
            postgresql18-server postgresql18-contrib pgvector_18
          docker run --rm --entrypoint rpm opennote-postgres:dev -q gpg-pubkey \
            --queryformat '%{NAME}-%{VERSION}-%{RELEASE} %{SUMMARY}\n'
          docker run --rm --entrypoint valkey-server opennote-valkey:dev --version

      # .env from the template: without it the stack refuses to start, by design.
      - name: Full stack, smoke tests, migration
        run: |
          cp infrastructure/compose/.env.example infrastructure/compose/.env
          OPENNOTE_MIGRATE_ON_START=true docker compose -f "$FULL" up -d --wait --wait-timeout 300
          scripts/smoke-test.sh http://localhost:8080
          scripts/smoke-test.sh --api-only http://localhost:8000
          version=$(docker compose -f "$FULL" exec -T postgres \
            psql -h /tmp -U opennote -d opennote -Atc 'select version_num from alembic_version')
          echo "alembic_version: $version"
          [[ $version == 0001 ]]
          # Volumes created by UID 1001 must not carry over to the arbitrary-UID run.
          docker compose -f "$FULL" down -v

      - name: Arbitrary UID, api image
        run: |
          docker run --rm --user 1000870000:0 --read-only --tmpfs /tmp opennote-api:dev python -c "import app"
          docker run -d --name api-uid --user 123456:0 --read-only --tmpfs /tmp -p 127.0.0.1:18000:8000 \
            -e OPENNOTE_DATABASE_URL=postgresql+psycopg://opennote:opennote@127.0.0.1:5432/opennote \
            -e OPENNOTE_VALKEY_URL=redis://127.0.0.1:6379/0 -e OPENNOTE_VAULT_ROOT=/var/lib/opennote/vaults \
            -e OPENNOTE_HISTORY_ROOT=/var/lib/opennote/history -e OPENNOTE_ENVIRONMENT=test opennote-api:dev
          # /healthz needs no database. Until uvicorn listens, docker's port proxy accepts the
          # connection and resets it (curl exit 56), which only --retry-all-errors retries.
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18000/healthz
          echo
          docker rm -f api-uid

      - name: Arbitrary UID, full stack
        run: |
          cat > "$RUNNER_TEMP/compose.uid.yaml" <<'YAML'
          services:
            api: {user: "1000870000:0"}
            worker: {user: "1000870000:0"}
            web: {user: "1000870000:0"}
            postgres: {user: "1000870000:0"}
            valkey: {user: "1000870000:0"}
          YAML
          OPENNOTE_MIGRATE_ON_START=true docker compose -f "$FULL" -f "$RUNNER_TEMP/compose.uid.yaml" \
            up -d --wait --wait-timeout 300
          scripts/smoke-test.sh http://localhost:8080
          docker compose -f "$FULL" -f "$RUNNER_TEMP/compose.uid.yaml" down -v

      - name: Dev stack (make up-deps) with the test database
        run: |
          docker compose -f "$DEV" up -d --wait --wait-timeout 300 postgres valkey
          extensions=$(docker compose -f "$DEV" exec -T postgres psql -h /tmp -U opennote -d opennote_test \
            -Atc "select string_agg(extname, ',' order by extname) from pg_extension")
          echo "opennote_test extensions: $extensions"
          [[ $extensions == pg_trgm,plpgsql,vector ]]
          docker compose -f "$DEV" down -v

      - name: Logs
        if: failure()
        run: |
          docker compose -f "$FULL" logs --no-color
          docker compose -f "$DEV" logs --no-color
          docker logs api-uid || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f api-uid || true
          docker compose -f "$FULL" down -v
          docker compose -f "$DEV" down -v
          rm -f infrastructure/compose/.env

      # The scans run whenever the images were built, also after a failed stack step.
      - name: Install Trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      # Every image is scanned even when an earlier one has findings; any finding fails the step.
      - name: Trivy image scans (HIGH and CRITICAL with a fix fail the job)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          trivy --version
          status=0
          for image in opennote-api:dev opennote-web:dev opennote-postgres:dev opennote-valkey:dev; do
            echo "trivy image $image"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image" || status=1
          done
          exit "$status"

  # The Helm chart (defaults, OpenShift, Ingress) and the kustomize base and OpenShift
  # overlay: lint, render and validate against the Kubernetes 1.30.0 schemas (the chart's
  # kubeVersion floor) and the newest ones. No cluster is involved
  # (docs/deployment/kubernetes.md).
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: infrastructure/helm/opennote
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
      # The Route schema: OpenShift 4.15, the newest in the community catalog, at a fixed commit.
      OPENSHIFT_SCHEMAS: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/openshift/v4.15-strict/{{.ResourceKind}}_{{.Group}}_{{.ResourceAPIVersion}}.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Tool versions
        run: |
          helm version
          kubectl version --client
          docker pull --quiet "$KUBECONFORM"
          docker run --rm "$KUBECONFORM" -v

      - name: helm lint
        run: |
          helm lint --strict "$CHART"
          helm lint --strict "$CHART" --set openshift.enabled=true
          helm lint --strict "$CHART" --set ingress.enabled=true --set ingress.host=opennote.example.com \
            --set ingress.tlsSecretName=opennote-tls

      - name: Render the chart and the kustomizations
        run: |
          out=$RUNNER_TEMP/manifests
          mkdir "$out"
          helm template opennote "$CHART" > "$out/helm-defaults.yaml"
          helm template opennote "$CHART" --set openshift.enabled=true > "$out/helm-openshift.yaml"
          helm template opennote "$CHART" --set ingress.enabled=true --set ingress.host=opennote.example.com \
            --set ingress.tlsSecretName=opennote-tls > "$out/helm-ingress.yaml"
          kubectl kustomize infrastructure/kubernetes/base > "$out/kustomize-base.yaml"
          kubectl kustomize infrastructure/openshift > "$out/kustomize-openshift.yaml"

      # What kubeconform cannot see: no Secret object anywhere, fsGroup on each of the four
      # pods on Kubernetes and on none on OpenShift (its restricted SCC assigns the group).
      - name: No Secret, fsGroup only off OpenShift
        run: |
          out=$RUNNER_TEMP/manifests
          if grep -n '^kind: Secret$' "$out"/*.yaml; then echo "a Secret is rendered"; exit 1; fi
          for file in helm-defaults helm-ingress kustomize-base; do
            count=$(grep -c '^ *fsGroup: 1001$' "$out/$file.yaml") || true
            [[ $count == 4 ]] || { echo "$file: fsGroup 1001 on $count pods, want 4"; exit 1; }
          done
          if grep -n fsGroup "$out/helm-openshift.yaml" "$out/kustomize-openshift.yaml"; then
            echo "fsGroup in an OpenShift variant"; exit 1
          fi

      - name: kubeconform
        run: |
          for version in 1.30.0 master; do
            echo "Kubernetes schemas: $version"
            docker run --rm -v "$RUNNER_TEMP/manifests:/manifests:ro" "$KUBECONFORM" -strict -summary \
              -kubernetes-version "$version" -schema-location default -schema-location "$OPENSHIFT_SCHEMAS" \
              /manifests
          done
