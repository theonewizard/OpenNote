# Security: secret scanning (gitleaks), dependency audits (pip-audit, npm audit), the
# bandit rules on the backend, and a Trivy filesystem scan; weekly as well as on every
# push and pull request (docs/development/setup.md, "Continuous integration").
name: security

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**", "security/**", "docs/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels a branch's running run; runs on main and scheduled runs finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # On pull requests the action lists the pull request's commits to scan them.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          # Findings go to the job log and summary; commenting would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: false
          # No SARIF artefact: the workflows upload none (setup.md, "Continuous integration").
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  python:
    name: pip-audit, bandit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      # The backend lines of `make bootstrap`.
      - name: Create .venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: pip-audit
        run: >-
          .venv/bin/pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
          -r backend/constraints.txt --strict
      - name: bandit
        run: .venv/bin/bandit -r backend/app -q

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

  trivy-fs:
    name: trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      # What the gate below leaves out, in the run's Summary tab, with the status per finding
      # (for the pip, npm and Swift packages scanned here: whether the advisory names a fixed
      # version) and the accepted risks from .trivyignore.yaml. Never fails the job: --exit-code 0
      # covers findings, and when Trivy itself fails the step turns red with the exit code while
      # continue-on-error keeps the job green (docs/development/setup.md, "Continuous integration").
      - name: trivy fs report (HIGH and CRITICAL without a fix, job summary)
        continue-on-error: true
        run: |
          status=0
          {
            echo "## Trivy fs: HIGH and CRITICAL vulnerabilities without a fix (reported, not gated)"
            echo '```'
            trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-status fixed --exit-code 0 \
              --ignorefile .trivyignore.yaml --show-suppressed . || { echo "trivy exited $?"; status=1; }
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: trivy fs (HIGH and CRITICAL with a fix fail the job)
        run: |
          trivy --version
          trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
