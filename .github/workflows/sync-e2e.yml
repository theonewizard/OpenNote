# Cross-client sync suite (roadmap P5-09): the web app and the Apple sync engine against
# one real server (scripts/sync-e2e.sh). Nightly, on demand, and on pull requests that
# touch sync code. Runs in the Swift image so the Apple engine builds on Linux next to the
# server; PostgreSQL and Valkey are service containers.
name: sync-e2e

on:
  pull_request:
    paths:
      - backend/app/sync/**
      - backend/app/api/sync.py
      - backend/app/vaults/**
      - web/src/sync/**
      - web/src/app/Layout.tsx
      - web/tests/sync-e2e/**
      - web/playwright.sync-e2e.config.ts
      - apple/Packages/OpenNoteSync/**
      - apple/Packages/OpenNoteStorage/**
      - scripts/sync-e2e.sh
      - .github/workflows/sync-e2e.yml
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

defaults:
  run:
    shell: bash

jobs:
  cross-client:
    name: web and Apple engine against the server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.4.1@sha256:6fbd5978b56a5a9ff05a48f8f678079fc45be496ecda15b4e74e8944fab857be
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        # Throwaway placeholders for this job's database.
        env:
          POSTGRES_USER: opennote
          POSTGRES_PASSWORD: opennote
          POSTGRES_DB: opennote_e2e
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=opennote --dbname=opennote_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPENNOTE_E2E_DATABASE_URL: postgresql+psycopg://opennote:opennote@postgres:5432/opennote_e2e
      OPENNOTE_E2E_VALKEY_URL: redis://valkey:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OpenNoteStorage links the system SQLite; curl waits for the servers.
      - name: Install the SQLite headers and curl
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev curl
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create .venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: npm ci and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: scripts/sync-e2e.sh
